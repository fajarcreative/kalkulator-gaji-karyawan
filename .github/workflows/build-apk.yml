name: Build Android APK & Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor Android
        run: |
          npm run build
          npx cap sync android

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/KalkulatorGaji-v1.0.apk
          ls -la release-output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KalkulatorGaji-Android-APK
          path: release-output/KalkulatorGaji-v1.0.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "GajiPro Android APK v1.0.0"
          body: |
            ### 📱 Download Aplikasi Kalkulator Gaji Karyawan (GajiPro)
            
            Unduh file APK langsung ke HP Android Anda:
            - **[KalkulatorGaji-v1.0.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.0/KalkulatorGaji-v1.0.apk)**

            #### Cara Pasang di HP Android:
            1. Download file `KalkulatorGaji-v1.0.apk`.
            2. Buka file APK di HP Android Anda.
            3. Jika muncul peringatan keamanan, izinkan *"Install dari sumber tidak dikenal" (Allow from unknown sources)*.
            4. Aplikasi GajiPro siap digunakan!
          files: release-output/KalkulatorGaji-v1.0.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
